[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-noroeste"
version = "0.1.0"
description = "Mapa regional independiente para Meshtastic y MeshCore"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Elena Musk", email = "elena@tuiterx.rocks" }
]
dependencies = [
    "msgpack>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4,<5",
]

[project.scripts]
mesh-noroeste = "mesh_noroeste.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
