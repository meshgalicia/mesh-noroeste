map $uri $mesh_cache_control {
    default         "public, max-age=300";
    ~^/$            "no-cache";
    ~^/index\.html$ "no-cache";
    ~^/data/        "no-store";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        application/javascript
        application/json
        image/svg+xml;

    add_header Cache-Control $mesh_cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location /data/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/mesh-noroeste_access.log;
    error_log /var/log/nginx/mesh-noroeste_error.log warn;
}
